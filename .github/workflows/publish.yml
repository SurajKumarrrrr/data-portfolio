name: Publish queued projects as new repos

on:
  push:
    branches: [main]
    paths: ["queue/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create repos and push projects
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATOR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          AUTHOR_NAME: Suraj Kumar Ajampudi
          AUTHOR_EMAIL: 102827160+SurajKumarrrrr@users.noreply.github.com
        run: bash scripts/publish.sh

      - name: Update index and clear queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Publish queued projects"
          git push
