# Single-container Airflow (standalone mode: scheduler + API server + DAG processor, SQLite metadata DB).
# Good for a local demo; a production setup would use Postgres + Celery/Kubernetes executor.
services:
  airflow:
    build: .
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "Europe/Berlin"
      ENERGY_SOURCE: "synthetic"          # set to "smard" to read the real SMARD API
      ENERGY_DATA_DIR: "/opt/airflow/data"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - energy-data:/opt/airflow/data

volumes:
  energy-data:
