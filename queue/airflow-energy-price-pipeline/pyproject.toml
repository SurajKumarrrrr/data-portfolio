[project]
name = "energy-pipeline"
version = "0.1.0"
description = "Airflow + DuckDB pipeline for German day-ahead electricity prices"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1,<3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "dags"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B017"]
