# Experiment definition: one MLflow experiment, one run per candidate.
experiment_name: credit-default
registered_model_name: credit-default-classifier
seed: 42
primary_metric: cv_roc_auc_mean  # select on CV (train folds only); test set stays untouched for reporting
min_improvement: 0.002         # challenger must beat champion by at least this much

data:
  n_samples: 6000
  test_size: 0.25

candidates:
  - name: logreg_baseline
    model: logistic_regression
    params: {C: 1.0}
  - name: logreg_strong_reg
    model: logistic_regression
    params: {C: 0.05}
  - name: random_forest
    model: random_forest
    params: {n_estimators: 200, max_depth: 8, min_samples_leaf: 5}
  - name: hist_gbm
    model: hist_gradient_boosting
    params: {learning_rate: 0.08, max_iter: 250, max_leaf_nodes: 31, l2_regularization: 0.1}
  - name: hist_gbm_shallow
    model: hist_gradient_boosting
    params: {learning_rate: 0.05, max_iter: 300, max_leaf_nodes: 15}
