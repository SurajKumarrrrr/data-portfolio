# Single-node Kafka in KRaft mode (no ZooKeeper) + producer + stream processor.
services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      retries: 20

  create-topic:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092",
                 "--create", "--if-not-exists", "--topic", "sensor-readings",
                 "--partitions", "3", "--replication-factor", "1"]

  producer:
    build: .
    depends_on:
      create-topic:
        condition: service_completed_successfully
    command: ["produce", "--bootstrap", "kafka:9092", "--speedup", "120"]

  processor:
    build: .
    depends_on:
      create-topic:
        condition: service_completed_successfully
    command: ["consume", "--bootstrap", "kafka:9092", "--db", "/data/sensors.db",
              "--idle-timeout", "60"]
    volumes:
      - ./data:/data
