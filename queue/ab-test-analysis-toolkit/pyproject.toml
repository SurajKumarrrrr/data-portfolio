[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abtest"
version = "0.1.0"
description = "A/B testing toolkit: power analysis, frequentist and Bayesian tests, CUPED, SRM checks, reports"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Suraj Kumar Ajampudi" }]
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "scipy>=1.13,<2"]

[project.scripts]
abtest-report = "abtest.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
