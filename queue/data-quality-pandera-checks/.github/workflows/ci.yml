name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: make install
      - name: Lint
        run: ruff check .
      - name: Tests
        run: make test
      - name: Data-quality gate (clean passes, defective is blocked)
        run: make gate
      - name: Upload data-quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dq-reports
          path: reports/
