[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dq-checks"
version = "0.1.0"
description = "Reusable data-quality layer with pandera schemas, failing-row reports and a CI gate"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Suraj Kumar Ajampudi" }]
dependencies = ["pandas>=2.2,<4", "numpy>=1.26,<3", "pandera>=0.24,<1"]

[project.scripts]
dq-checks = "dq_checks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
