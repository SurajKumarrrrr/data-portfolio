name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests (includes a full dbt build on a small synthetic dataset)
        run: pytest -q
      - name: dbt parse + docs generate
        env:
          DUCKDB_PATH: ${{ github.workspace }}/warehouse.duckdb
        run: |
          python -m ecom.pipeline --customers 500
          cd dbt_project && dbt docs generate --profiles-dir .
