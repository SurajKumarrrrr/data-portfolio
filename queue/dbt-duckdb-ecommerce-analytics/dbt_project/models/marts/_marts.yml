version: 2

models:
  - name: fct_orders
    description: "Order fact. Grain: one row per order. All amounts in EUR."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: order_total
        data_tests: [not_null, non_negative]
      - name: net_revenue
        description: Successful payments minus refunds.
        data_tests: [not_null, non_negative]
      - name: payment_method
        data_tests:
          - accepted_values:
              arguments:
                values: ["card", "paypal", "klarna", "sepa_debit", "none"]

  - name: fct_order_items
    description: "Order line fact. Grain: one row per order item."
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

  - name: dim_customers
    description: Customer dimension with lifetime metrics and a rule-based segment.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_segment
        data_tests:
          - accepted_values:
              arguments:
                values: ["prospect", "one_time", "repeat", "loyal"]
      - name: lifetime_net_revenue
        data_tests: [non_negative]

  - name: dim_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: mart_monthly_revenue
    description: Monthly KPIs for the management report.
    columns:
      - name: month_start
        data_tests: [unique, not_null]

  - name: mart_cohort_retention
    description: Monthly first-order cohorts and the share still ordering N months later.
    columns:
      - name: retention_rate
        data_tests: [not_null, non_negative]

  - name: mart_category_performance
    columns:
      - name: category
        data_tests: [unique, not_null]
