version: 2

models:
  - name: stg_shop__customers
    description: One row per customer; e-mail and country normalised.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: email
        data_tests: [unique, not_null]
      - name: country_code
        data_tests:
          - accepted_values:
              arguments:
                values: ["DE", "AT", "CH", "NL", "FR"]

  - name: stg_shop__products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: list_price
        data_tests: [not_null, non_negative]
      - name: unit_cost
        data_tests: [not_null, non_negative]

  - name: stg_shop__orders
    description: Latest version of each order (deduplicated on source_loaded_at).
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shop__customers')
                field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ["placed", "shipped", "delivered", "returned", "cancelled"]

  - name: stg_shop__order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_shop__orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_shop__products')
                field: product_id
      - name: quantity
        data_tests: [non_negative]

  - name: stg_shop__payments
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_shop__orders')
                field: order_id
      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["success", "failed", "refunded"]
      - name: payment_method
        data_tests:
          - accepted_values:
              arguments:
                values: ["card", "paypal", "klarna", "sepa_debit"]
