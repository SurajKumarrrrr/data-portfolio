version: 2

sources:
  - name: shop
    description: Raw extracts from the shop OLTP system and payment provider, loaded as VARCHAR by ecom/load.py.
    schema: raw
    loaded_at_field: _ingested_at
    tables:
      - name: customers
        columns:
          - name: customer_id
            data_tests: [not_null, unique]
      - name: products
        columns:
          - name: product_id
            data_tests: [not_null, unique]
      - name: orders
        description: May contain several versions of one order (re-delivered by the extractor).
        columns:
          - name: order_id
            data_tests: [not_null]
      - name: order_items
        columns:
          - name: order_item_id
            data_tests: [not_null, unique]
      - name: payments
        columns:
          - name: payment_id
            data_tests: [not_null, unique]
