[project]
name = "dbt-duckdb-ecommerce-analytics"
version = "1.0.0"
description = "dbt + DuckDB analytics engineering project for an e-commerce star schema"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
