[project]
name = "taxi-batch"
version = "0.1.0"
description = "PySpark batch job for NYC-TLC-style taxi trip data"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Suraj Kumar Ajampudi" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
